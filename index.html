<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recherche dans des fichiers</title>
  <link rel="stylesheet" href="RETROUVER-DOC.css">
  <!-- Script pour lire les fichiers PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <!-- Script pour lire les fichiers Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <!-- Script pour lire les fichiers Word -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth/mammoth.browser.min.js"></script>
</head>

<body>
  <center>
  <h1>RECHER DES FICHIERS DEPUIS UN MOT</h1>
</center>
<br><br><br>
<div class="container">
    <!-- Input pour saisir le mot à rechercher -->
  <label for="searchTerm">Mot à rechercher :</label>
  <input type="text" id="searchTerm" placeholder="Entrez un mot à rechercher">
  <br><br>

  <!-- Input pour sélectionner le dossier -->
  <input type="file" id="directoryInput" webkitdirectory directory multiple>
  <br><br>

  <!-- Bouton pour lancer la recherche -->
  <button id="searchButton">Rechercher</button>

  <!-- Zone pour afficher les résultats -->
  <pre id="results"></pre>

  <!-- Script pour inclure les fonctionnalités principales -->
  <script src="RETROUVER-DOCU1.js"></script>
</body>
</html>
